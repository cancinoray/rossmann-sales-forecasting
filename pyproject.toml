[project]
name = "rossmann-sales-forecast"
version = "0.1.0"
description = "Daily store-sales forecasting for Rossmann, with a FastAPI service and Docker packaging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18",
    "pydantic>=2.9",
    "scikit-learn>=1.5",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.32",
    "xgboost>=2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ipykernel>=6",
    "jupyterlab>=4",
    "matplotlib>=3.9",
    "nbconvert>=7",
    "pytest>=8",
    "seaborn>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
